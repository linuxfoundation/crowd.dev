  /akrites-external/blast-radius/jobs:
    post:
      operationId: submitBlastRadiusJob
      summary: 2a — Submit a blast-radius analysis job
      description: >
        Always exactly one job per request — no bulk submit. Omit package for
        an advisory-wide analysis (only supported for single-package
        advisories); provide it to narrow to one package, which is required
        for advisories affecting more than one. Starts a Temporal workflow
        running the 4-stage reachability pipeline
        (intel, dependents, reachability, report) for npm, go, maven, or cargo; other
        ecosystems fail fast with ECOSYSTEM_NOT_SUPPORTED. Poll status/results
        via GET /jobs/{analysisId}.


        Not yet implemented: the 7-day result cache and force-bypass semantics.
      tags: [Blast Radius]
      security:
        - M2MBearer:
            - read:akrites-advisories
        - M2MBearer:
            - read:packages
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BlastRadiusJobRequest"
      responses:
        "202":
          description: Job accepted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BlastRadiusJobEntry"
        "400":
          description: >
            Validation error (missing/empty advisoryId), or an unsupported
            ecosystem — only npm, go, maven, and cargo are supported today, so any other
            value (including a missing ecosystem) is rejected before a
            workflow is started.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Missing or invalid bearer token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Token missing read:akrites-advisories, or read:packages, scope.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          description: Too many requests — rate-limited independently of the other endpoints.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /akrites-external/blast-radius/jobs:batch:
    post:
      operationId: submitBlastRadiusJobBatch
      summary: 2a bulk — Submit multiple blast-radius analysis jobs
      description: >
        One job per array entry, same semantics as the single-job submit —
        omit package for an advisory-wide analysis (only supported for
        single-package advisories), provide it to narrow to a single package.
        Each entry starts its own Temporal workflow, so the
        batch is capped at 20 jobs (10 recommended as the default batch
        size), much lower than the 100-item read batches, and stays behind
        the same strict rate limiter as the single-job route.


        A per-job failure does not fail the whole batch — that entry comes
        back with status: 'failed' and the rest still submit.
      tags: [Blast Radius]
      security:
        - M2MBearer:
            - read:akrites-advisories
        - M2MBearer:
            - read:packages
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BlastRadiusJobBatchRequest"
      responses:
        "202":
          description: Jobs accepted, in request order.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BlastRadiusJobBatchResponse"
        "400":
          description: Validation error (empty array, >20 items, or an invalid job entry).
          content:
            application/json:
              schema:

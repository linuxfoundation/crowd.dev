                $ref: "#/components/schemas/Error"
        "403":
          description: Token missing read:akrites-advisories, or read:packages, scope.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          description: Too many requests — rate-limited independently of the other endpoints.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /akrites-external/blast-radius/jobs:batch/poll:
    post:
      operationId: getBlastRadiusJobBatch
      summary: 2b bulk — Poll multiple blast-radius analysis jobs
      description: >
        Same found/not-found echo shape as the other batch endpoints: an
        unknown analysisId comes back { found: false, analysis: null }
        instead of 404ing the whole request. Read-only, so it is rate-limited
        the same as the other non-blast-radius endpoints, not the strict
        submit limiter.
      tags: [Blast Radius]
      security:
        - M2MBearer:
            - read:akrites-advisories
        - M2MBearer:
            - read:packages
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BlastRadiusJobPollBatchRequest"
      responses:
        "200":
          description: One page of results, in request order.
          content:
            application/json:
              schema:
                type: object
                required: [page, pageSize, total, results]
                properties:
                  page:
                    type: integer
                  pageSize:
                    type: integer
                  total:
                    type: integer
                    description: Total number of requested analysisIds, across all pages.
                  results:
                    type: array
                    items:
                      $ref: "#/components/schemas/BlastRadiusAnalysisBulkEntry"
        "400":
          description: Validation error (empty array, >100 items, or a non-uuid analysisId).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Missing or invalid bearer token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Token missing read:akrites-advisories, or read:packages, scope.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /akrites-external/blast-radius/jobs/{analysisId}:
    get:
      operationId: getBlastRadiusJob
      summary: 2b — Poll a blast-radius analysis job
      description: >
        Returns job status and, once status is 'done', the summary and
        per-dependent results. summary and results are null for any other
        status.
      tags: [Blast Radius]
      security:
        - M2MBearer:
            - read:akrites-advisories
        - M2MBearer:
            - read:packages
      parameters:
        - name: analysisId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Job status (and results, once done).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BlastRadiusAnalysis"
        "400":
          description: Malformed analysisId (not a UUID).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Missing or invalid bearer token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Token missing read:akrites-advisories, or read:packages, scope.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: No job with this analysisId.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          description: Too many requests — rate-limited independently of the other endpoints.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /akrites-external/contacts/detail:
    get:
      operationId: getContactDetail
      summary: Get security contact detail by PURL
      description: >
        Requires read:akrites-maintainers, or read:maintainer-roles from the old Self
        Serve client as a fallback. Never reachable with the packages scope.
      tags: [Contacts]

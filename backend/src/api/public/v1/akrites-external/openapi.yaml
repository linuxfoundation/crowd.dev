                required: [page, pageSize, total, results]
                properties:
                  page:
                    type: integer
                  pageSize:
                    type: integer
                  total:
                    type: integer
                    description: Total number of requested analysisIds, across all pages.
                  results:
                    type: array
                    items:
                      $ref: '#/components/schemas/BlastRadiusAnalysisBulkEntry'
        '400':
          description: Validation error (empty array, >100 items, or a non-uuid analysisId).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Missing or invalid bearer token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Token missing read:akrites-advisories, or read:packages, scope.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'


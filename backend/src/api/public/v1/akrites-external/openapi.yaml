                  minimum: 1
                  default: 1
                pageSize:
                  type: integer
                  minimum: 1
                  maximum: 100
                  default: 20
      responses:
        "200":
          description: One page of results, in request order.
          content:
            application/json:
              schema:
                type: object
                required: [page, pageSize, total, results]
                properties:
                  page:
                    type: integer
                  pageSize:
                    type: integer
                  total:
                    type: integer
                    description: Total number of requested purls, across all pages.
                  results:
                    type: array
                    items:
                      $ref: "#/components/schemas/ProjectProfilingBulkEntry"
        "400":
          description: Validation error (empty array, >100 items, malformed purl).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Missing or invalid bearer token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Token missing read:akrites-maintainers or read:maintainer-roles scope.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /akrites-external/advisories/detail:

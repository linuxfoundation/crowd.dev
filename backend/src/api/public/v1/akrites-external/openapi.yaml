openapi: 3.0.3
info:
  title: CDP → Akrites External API
  version: 0.1.0
  description: >
    Read-only external API exposing CDP package security data to the Akrites
    service. Authenticated via Auth0 M2M client-credentials — CDP only
    verifies the resulting access token; the assertion exchange happens
    entirely between Akrites and Auth0.


    Packages, Advisories and Contacts endpoints are implemented. Blast Radius
    submit (2a) and poll (2b) are both implemented, backed by a 4-stage
    Temporal pipeline (intel, dependents, reachability, report) for npm, go, maven, and
    cargo packages; other ecosystems fail fast with ECOSYSTEM_NOT_SUPPORTED. The
    7-day result cache is specced separately and not yet built.


    Auth0 now issues a dedicated Akrites Enclave M2M client with its own
    read:akrites-packages / read:akrites-advisories / read:akrites-maintainers
    scopes. Until Akrites cuts over to that client's credentials, the Self Serve
    client's existing scopes (read:packages, read:stewardships,
    read:maintainer-roles) still work on every operation below — each operation
    lists both the new dedicated scope(s) and the old fallback scope(s) as
    alternatives. Drop the old alternative once the cutover is confirmed.

servers:
  - url: https://cm.lfx.dev/api/v1
    description: Production

security:
  - M2MBearer:
      - read:akrites-packages
  - M2MBearer:
      - read:packages
  - M2MBearer:
      - read:stewardships

tags:
  - name: Packages
    description: >
      Package detail — requires read:akrites-packages (dedicated Akrites Enclave
      scope), or either read:packages or read:stewardships from the old Self Serve
      client as a fallback until the cutover completes.
  - name: Advisories
    description: >
      Security advisories for a package, split out of package detail. Requires
      read:akrites-advisories (dedicated Akrites Enclave scope), or read:packages
      from the old Self Serve client as a fallback until the cutover completes
      (advisories need no stewardship read).
  - name: Contacts
    description: >
      Security contacts for a package — includes contact PII (e.g. reporter
      emails). Requires read:akrites-maintainers (dedicated Akrites Enclave
      scope), or read:maintainer-roles from the old Self Serve client as a
      fallback until the cutover completes — never reachable via the packages
      scopes. Reserved for security contacts only — the assembled
      vulnerability-reporting protocol (methods and guidelines)
      is served by GET /akrites-external/project-profiling.
  - name: Blast Radius
    description: >
      Advisory reachability analysis — submit (2a) and poll (2b) are both
      implemented, each with a bulk counterpart. Submitting kicks off a
      Temporal workflow that runs the npm, go, maven, or cargo reachability pipeline (other
      ecosystems fail fast with ECOSYSTEM_NOT_SUPPORTED); poll returns job
      status and, once done, results. Bulk submit (jobs:batch) is capped at
      20 jobs per request (10 recommended as the default batch size) — each
      entry starts its own workflow — and stays behind the same strict rate
      limiter as the single-job route; bulk poll
      (jobs:batch/poll) is read-only and capped at 100 like the other batch
      endpoints. Same scope note as Advisories applies (read:akrites-advisories,
      or read:packages as a fallback until the cutover completes).
  - name: Project Profiling
    description: >
      Assembled vulnerability-reporting protocol for a package's best-matched
      repo — the full ordered list of ways to report a vulnerability (declared
      methods first, security-contact fallbacks after) plus any disclosure
      guidelines. Fallback methods can carry contact PII (maintainer/committer
      emails), so it takes the same scopes as Contacts: read:akrites-maintainers,
      or read:maintainer-roles as a fallback until the cutover completes — never
      reachable via the packages scopes.

components:
  securitySchemes:
    # Modeled as oauth2/clientCredentials (not http/bearer): OpenAPI only allows
    # non-empty scope arrays in security requirements for oauth2 / openIdConnect
    # schemes.
    M2MBearer:
      type: oauth2
      description: >
        Auth0 machine-to-machine client-credentials flow. Akrites exchanges its
        client ID/secret with Auth0 for a JWT and sends it as
        `Authorization: Bearer <token>`; CDP only verifies the resulting token.
      flows:
        clientCredentials:
          tokenUrl: https://linuxfoundation.auth0.com/oauth/token
          scopes:
            read:akrites-packages: Read package detail (dedicated Akrites Enclave scope)
            read:akrites-advisories: Read security advisories and submit/poll blast-radius jobs (dedicated Akrites Enclave scope)
            read:akrites-maintainers: Read security contacts (dedicated Akrites Enclave scope)
            read:packages: Read package detail (fallback — old Self Serve client scope, being phased out)
            read:stewardships: Read package stewardship data (fallback — old Self Serve client scope, being phased out)
            read:maintainer-roles: Read security contacts (fallback — old Self Serve client scope, being phased out)

  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              example: BAD_REQUEST
            message:
              type: string

    ConflictError:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              example: CONFLICT
            message:
              type: string
            context:
              type: object
              properties:
                jobId:
                  type: string
                  format: uuid
                  description: The job whose result is still readable; poll it.

    Ecosystem:
      type: string
      example: npm

    HealthBand:
      type: string
      enum: [excellent, healthy, fair, concerning, critical]
      description: >
        Health band on the internal scale (best→worst), returned verbatim —
        no external crosswalk.

    PackageDetail:
      type: object
      required:
        - purl
        - name
        - ecosystem
        - latestVersion
        - versionCount
        - health
        - impact
        - riskSignals
        - security
        - provenance
        - supplyChainIntegrity
      properties:
        purl:
          type: string
        name:
          type: string
        ecosystem:
          $ref: "#/components/schemas/Ecosystem"
        latestVersion:
          type: string
          nullable: true
        versionCount:
          type: integer
          nullable: true
        health:
          type: object
          required: [score, band, subScores, signalCoverageHealth]
          properties:
            score:
              type: integer
              nullable: true
              minimum: 0
              maximum: 100
            band:
              $ref: "#/components/schemas/HealthBand"
            subScores:
              type: object
              required: [maintainerHealth, securitySupplyChain, developmentActivity]
              properties:
                maintainerHealth:
                  type: number
                  nullable: true
                securitySupplyChain:
                  type: number
                  nullable: true
                developmentActivity:
                  type: number
                  nullable: true
            signalCoverageHealth:
              type: object
              nullable: true
              additionalProperties: true
        impact:
          type: object
          required:
            [
              score,
              downloadsLast30Days,
              dependentPackagesCount,
              dependentReposCount,
              transitiveReach,
            ]
          properties:
            score:
              type: integer
              nullable: true
              minimum: 0
              maximum: 100
            downloadsLast30Days:
              type: string
              nullable: true
              description: Raw registry count string, not normalized.
            dependentPackagesCount:
              type: integer
              nullable: true
            dependentReposCount:
              type: integer
              nullable: true
            transitiveReach:
              type: integer
              nullable: true
              description: Always null for now — reserved for future computation.
        riskSignals:
          type: object
          required:
            - lifecycle
            - maintainerBusFactor
            - lastReleaseAt
            - hasSecurityFile
            - hasSecurityPolicy
            - branchProtectionEnabled
            - openssfScorecardScore
          properties:
            lifecycle:
              type: string
              enum: [active, stable, declining, abandoned, archived, null]
              nullable: true
              description: >
                Lifecycle stage on the internal scale, returned verbatim — no
                external crosswalk. Null when unknown or unrecognized.
            maintainerBusFactor:
              type: integer
              nullable: true
            lastReleaseAt:
              type: string
              format: date-time
              nullable: true
            hasSecurityFile:
              type: boolean
              nullable: true
            hasSecurityPolicy:
              type: boolean
              nullable: true
            branchProtectionEnabled:
              type: boolean
              nullable: true
            openssfScorecardScore:
              type: number
              format: float
              minimum: 0
              maximum: 10
              nullable: true
        security:
          type: object
          required:
            [
              securityPolicyUrl,
              vulnerabilityReportingUrl,
              bugBountyUrl,
              pvrEnabled,
              criticalVulnerabilityFlag,
            ]
          properties:
            securityPolicyUrl:
              type: string
              nullable: true
            vulnerabilityReportingUrl:
              type: string
              nullable: true
            bugBountyUrl:
              type: string
              nullable: true
            pvrEnabled:
              type: boolean
              nullable: true
            criticalVulnerabilityFlag:
              type: boolean
              nullable: true
        provenance:
          type: object
          required:
            [
              resolvedRepositoryUrl,
              declaredRepositoryUrl,
              mappingConfidenceScore,
              mappingConfidenceLabel,
              lastCommitAt,
            ]
          properties:
            resolvedRepositoryUrl:
              type: string
              nullable: true
              description: >
                Best available repository URL. Preferred source is the
                confidence-ranked package_repos → repos join — the repo CDP has
                actually resolved and enriched (scorecard, branch protection,
                etc.). When the package has no package_repos link yet, this
                falls back to the canonical repository_url on the package row,
                which is NOT confidence-resolved or enriched. Use
                mappingConfidenceScore / mappingConfidenceLabel to tell the two
                apart: both are null when the fallback URL is returned.
            declaredRepositoryUrl:
              type: string
              nullable: true
              description: Raw repository URL as declared in the package's own metadata.
            mappingConfidenceScore:
              type: number
              format: float
              minimum: 0
              maximum: 1
              nullable: true
            mappingConfidenceLabel:
              type: string
              enum: [High, Medium, Low, null]
              nullable: true
            lastCommitAt:
              type: string
              format: date-time
              nullable: true
        supplyChainIntegrity:
          type: object
          required: [buildProvenance, signedReleases]
          properties:
            buildProvenance:
              type: string
              nullable: true
              description: Always null for now — reserved.
            signedReleases:
              type: string
              nullable: true
              description: Always null for now — reserved.

    PackageDetailBulkEntry:
      type: object
      required: [requestedPurl, found, package]
      properties:
        requestedPurl:
          type: string
        found:
          type: boolean
        package:
          type: object
          nullable: true
          allOf:
            - $ref: "#/components/schemas/PackageDetail"

    Advisory:
      type: object
      required: [osvId, severity, resolution, isCritical]
      properties:
        osvId:
          type: string
          example: GHSA-xxxx-xxxx-xxxx
        severity:
          type: string
          enum: [critical, high, moderate, low, null]
          nullable: true
          description: >
            Lowercased advisory severity. Any stored value outside this enum is
            returned as null rather than echoed verbatim.
        resolution:
          type: string
          enum: [open, patched, null]
          nullable: true
          description: >
            Whether the package's latest version is still affected. Null when it
            can't be determined (no latest version, or no affected ranges recorded).
        isCritical:
          type: boolean
          nullable: true
          description: cvss >= 7.0. Null when the advisory has no CVSS score.

    AdvisoryDetail:
      type: object
      required: [purl, advisories]
      properties:
        purl:
          type: string
        advisories:
          type: array
          items:
            $ref: "#/components/schemas/Advisory"

    AdvisoryDetailBulkEntry:
      type: object
      required: [requestedPurl, found, advisories]
      properties:
        requestedPurl:
          type: string
        found:
          type: boolean
        advisories:
          type: object
          nullable: true
          allOf:
            - $ref: "#/components/schemas/AdvisoryDetail"

    BlastRadiusJobRequest:
      type: object
      required: [advisoryId, ecosystem]
      properties:
        advisoryId:
          type: string
          pattern: '^(GHSA-[0-9a-zA-Z]{4}-[0-9a-zA-Z]{4}-[0-9a-zA-Z]{4}|CVE-\d{4}-\d{4,})$'
          description: >
            GHSA or CVE identifier. Any other format, including free-text
            strings, is rejected with a 400.
          example: GHSA-jf85-cpcp-j695
        ecosystem:
          type: string
          enum: [npm, go, maven, cargo]
          description: >
            Required. The reachability pipeline supports npm, go, maven, and cargo today —
            any other value, or a missing ecosystem, is rejected with a 400.
          example: npm
        package:
          type: string
          nullable: true
          description: >
            Optional. Full purl or bare package name. If omitted, the analysis
            is advisory-wide: for advisories affecting a single package, that
            package is analyzed. Advisories affecting multiple packages
            require an explicit package — the job fails (status: 'failed')
            otherwise, since analyzing every affected package in one
            aggregate result is not yet supported.
        force:
          type: boolean
          default: false
          description: Bypasses the 7-day cache and always triggers a new run. Use sparingly.

    BlastRadiusJobEntry:
      type: object
      required: [analysisId, advisoryId, package, ecosystem, status]
      description: >
        Response body of 2a for a single submitted job. Returned directly (not
        wrapped in an array) by the single-job submit; the batch submit (2a bulk)
        returns an array of these under `results` — see BlastRadiusJobBatchResponse.
      properties:
        analysisId:
          type: string
          description: Opaque identifier for polling via 2b (GET .../jobs/{analysisId}).
        advisoryId:
          type: string
        package:
          type: string
          nullable: true
          description: Echoes the request's package. Null when the request omitted it.
        ecosystem:
          type: string
          enum: [npm, go, maven, cargo]
          description: Echoes the request's ecosystem. Always present — the request requires it.
        status:
          type: string
          enum: [pending, running, done, failed]
          description: >
            Pending in the single-job submit response, always returned before the
            Temporal workflow runs. In the batch submit response, a job whose
            workflow failed to start comes back as failed instead — the rest of
            the batch is unaffected.

    BlastRadiusJobBatchRequest:
      type: object
      required: [jobs]
      properties:
        jobs:
          type: array
          minItems: 1
          maxItems: 20
          description: >
            Capped much lower than the 100-item read batches — each entry
            starts its own Temporal workflow, so the batch multiplies
            workflow starts (and reachability-analysis cost) per request.
            10 is the recommended default batch size; 20 is the hard limit.
          items:
            $ref: "#/components/schemas/BlastRadiusJobRequest"

    BlastRadiusJobBatchResponse:
      type: object
      required: [results]
      description: >
        Plain array in request order, one entry per requested job — unlike the
        read batches there is no found/not-found case, but a job can still come
        back with status: failed if row creation or the workflow start failed.
      properties:
        results:
          type: array
          items:
            $ref: "#/components/schemas/BlastRadiusJobEntry"

    BlastRadiusJobPollBatchRequest:
      type: object
      required: [analysisIds]
      properties:
        analysisIds:
          type: array
          minItems: 1
          maxItems: 100
          items:
            type: string
            format: uuid
        page:
          type: integer
          minimum: 1
          default: 1
        pageSize:
          type: integer
          minimum: 1
          maximum: 100
          default: 20

    BlastRadiusAnalysisBulkEntry:
      type: object
      required: [requestedAnalysisId, found, analysis]
      properties:
        requestedAnalysisId:
          type: string
        found:
          type: boolean
        analysis:
          type: object
          nullable: true
          allOf:
            - $ref: "#/components/schemas/BlastRadiusAnalysis"

    BlastRadiusResultConfidence:
      type: string
      enum: [high, medium, low]
      description: Crosswalk of the 0-1 reachability confidence score into bands (>=0.8 high, >=0.4 medium, else low).

    BlastRadiusResultItem:
      type: object
      required: [dependent, affected, verdict, confidence, evidence, downloadsLast30Days]
      properties:
        dependent:
          type: string
          description: Purl of the analyzed dependent package.
        affected:
          type: boolean
          description: True only when verdict is 'affected'. Kept for backwards compatibility — prefer verdict, since this field can't distinguish 'not_affected' from 'unclear'.
        verdict:
          type: string
          enum: [affected, not_affected, unclear]
          description: Raw reachability verdict. 'unclear' covers both a genuine ambiguous read and a persistent agent failure.
        confidence:
          $ref: "#/components/schemas/BlastRadiusResultConfidence"
        evidence:
          type: string
          nullable: true
          description: Flattened file:line — snippet evidence lines from the reachability agent, one per line.
        downloadsLast30Days:
          type: string
          nullable: true

    BlastRadiusAnalysisSummary:
      type: object
      required:
        - totalDependentsInRange
        - dependentsExcludedUpfront
        - dependentsAnalyzed
        - dependentsAffected
        - affectedPercentage
        - affectedDependents
      properties:
        totalDependentsInRange:
          type: integer
          description: Sum of dependentsAnalyzed and dependentsExcludedUpfront; the count of dependents that fell within the vulnerable version range (before top-N cutoff was applied).
        dependentsExcludedUpfront:
          type: integer
          description: totalDependentsInRange minus dependentsAnalyzed.
        dependentsAnalyzed:
          type: integer
          description: Number of dependents that received a reachability verdict.
        dependentsAffected:
          type: integer
        affectedPercentage:
          type: number
          nullable: true
          description: Rounded to 1 decimal. Null when dependentsAnalyzed is 0, to avoid a misleading 0%.
        affectedDependents:
          type: array
          items:
            type: string

    BlastRadiusAnalysis:
      type: object
      required:
        - analysisId
        - status
        - advisoryId
        - package
        - ecosystem
        - submittedAt
        - completedAt
        - errorMessage
        - summary
        - results
      description: Response body of 2b — poll for job status and, once done, results.
      properties:
        analysisId:
          type: string
        status:
          type: string
          enum: [pending, running, done, failed]
        advisoryId:
          type: string
        package:
          type: string
          nullable: true
        ecosystem:
          type: string
          enum: [npm, go, maven, cargo]
        submittedAt:
          type: string
          nullable: true
          format: date-time
        completedAt:
          type: string
          nullable: true
          format: date-time
        errorMessage:
          type: string
          nullable: true
        summary:
          type: object
          nullable: true
          allOf:
            - $ref: "#/components/schemas/BlastRadiusAnalysisSummary"
          description: Null until status is 'done'.
        results:
          type: array
          nullable: true
          description: Null until status is 'done'.
          items:
            $ref: "#/components/schemas/BlastRadiusResultItem"

    ContactConfidenceBand:
      type: string
      enum: [PRIMARY, SECONDARY, FALLBACK, NONE]
      description: Per-contact confidence — mirrors the internal SecurityContact confidence enum.

    OverallConfidenceBand:
      type: string
      enum: [PRIMARY, SECONDARY, FALLBACK, NONE]
      description: >
        Aggregate confidence, derived from the highest-scoring contact. Uses the
        internal SecurityContact confidence scale, returned verbatim — same scale
        as ContactConfidenceBand, no external crosswalk. NONE when there are no
        contacts.

    SecurityContact:
      type: object
      required: [channel, value, role, confidenceBand, confidenceScore]
      properties:
        channel:
          type: string
          enum: [email, github-pvr, github-handle, url, web-form]
          description: Mirrors the internal SecurityContact.channel enum; passed through verbatim.
        value:
          type: string
          example: security@example.org
        role:
          type: string
          enum: [security-team, maintainer, admin, committer, org-owner]
          description: Mirrors the internal SecurityContact.role enum; passed through verbatim.
        confidenceBand:
          $ref: "#/components/schemas/ContactConfidenceBand"
        confidenceScore:
          type: number
          format: float
          minimum: 0
          maximum: 1

    ProjectProfilingMethod:
      type: object
      description: >
        One assembled way to report a vulnerability. Declared methods (confidence
        'declared') come from the repo's SECURITY.md / linked policy pages / PVR
        flag / security.txt; inferred methods (confidence 'inferred') are
        security-contact fallbacks. Ordered preferred → accepted → fallback →
        prohibited in the parent methods array.
      required: [type, status, endpoint, condition, confidence, provenance]
      properties:
        type:
          type: string
          description: Channel type, e.g. github-pvr, email, web-form, security-txt, bounty-platform, mailing-list.
        status:
          type: string
          enum: [preferred, accepted, fallback, prohibited]
        endpoint:
          type: string
          description: Actionable target — a URL or email address.
          example: https://github.com/o/r/security/advisories/new
        condition:
          type: string
          nullable: true
          description: Optional precondition on using this method, verbatim from the source.
        confidence:
          type: string
          enum: [declared, inferred]
        provenance:
          type: object
          additionalProperties: true
          description: Where this method was derived from (e.g. file path + blobOid + parser, an api flag, or a contact channel/table).

    ProjectProfilingGuidelines:
      type: object
      nullable: true
      description: Disclosure guidelines parsed from the security policy, or null when none were found.
      required: [generalPrinciples, avoid, recommend]
      properties:
        generalPrinciples:
          type: array
          items:
            type: string
        avoid:
          type: array
          items:
            type: string
        recommend:
          type: array
          items:
            type: object
            required: [scenario, action]
            properties:
              scenario:
                type: string
              action:
                type: string

    ProjectProfiling:
      type: object
      required: [purl, declared, methods, guidelines, sources, bugBountyUrl, assembledAt]
      properties:
        purl:
          type: string
        declared:
          type: boolean
          description: True when a reporting protocol was explicitly declared (vs. purely inferred from contacts).
        methods:
          type: array
          items:
            $ref: "#/components/schemas/ProjectProfilingMethod"
        guidelines:
          $ref: "#/components/schemas/ProjectProfilingGuidelines"
        sources:
          type: array
          items:
            type: object
            additionalProperties: true
          description: Provenance records for the signals that fed this assembly.
        bugBountyUrl:
          type: string
          nullable: true
          description: Bug-bounty program URL for the best-matched repo, or null when none is known.
        assembledAt:
          type: string
          format: date-time
          nullable: true

    ProjectProfilingBulkEntry:
      type: object
      required: [requestedPurl, found, profiling]
      properties:
        requestedPurl:
          type: string
        found:
          type: boolean
        profiling:
          type: object
          nullable: true
          allOf:
            - $ref: "#/components/schemas/ProjectProfiling"

    ContactDetail:
      type: object
      description: >
        Security contacts for a package, plus its security-policy URLs and repo
        mapping. Reserved for security contacts only — the assembled
        vulnerability-reporting protocol (methods and guidelines)
        is served by GET /akrites-external/project-profiling.
      required:
        - purl
        - name
        - ecosystem
        - overallConfidenceBand
        - contacts
        - securityPolicyUrl
        - vulnerabilityReportingUrl
        - bugBountyUrl
        - pvrEnabled
        - declaredRepositoryUrl
        - resolvedRepositoryUrl
        - repoMappingConfidence
      properties:
        purl:
          type: string
        name:
          type: string
        ecosystem:
          $ref: "#/components/schemas/Ecosystem"
        overallConfidenceBand:
          $ref: "#/components/schemas/OverallConfidenceBand"
        contacts:
          type: array
          items:
            $ref: "#/components/schemas/SecurityContact"
        securityPolicyUrl:
          type: string
          nullable: true
        vulnerabilityReportingUrl:
          type: string
          nullable: true
        bugBountyUrl:
          type: string
          nullable: true
        pvrEnabled:
          type: boolean
          nullable: true
        declaredRepositoryUrl:
          type: string
          nullable: true
          description: Raw repository URL as declared in the package's own metadata.
        resolvedRepositoryUrl:
          type: string
          nullable: true
          description: >
            Best available repository URL, resolved via the confidence-ranked
            package_repos → repos join — the repo CDP has actually resolved and
            enriched (scorecard, branch protection, etc.). Null when the
            package has no package_repos link yet.
        repoMappingConfidence:
          type: number
          format: float
          minimum: 0
          maximum: 1
          nullable: true
          description: >
            Confidence score of the package_repos mapping used to resolve
            resolvedRepositoryUrl. Null when the package has no package_repos
            link yet.

    MemberContributorsBody:
      type: object
      description: Package, repository and affiliated people of a member-contributors response, without the collection status.
      required:
        - purl
        - name
        - ecosystem
        - repoUrl
        - repoMappingConfidence
        - contributors
        - maintainers
      properties:
        purl:
          type: string
          example: pkg:npm/express
        name:
          type: string
          example: express
        ecosystem:
          $ref: "#/components/schemas/Ecosystem"
        repoUrl:
          type: string
          description: >
            Best available repository URL, resolved via the confidence-ranked
            package_repos → repos join. Always set on 200; a package without a
            linked repository returns 404.
          example: https://github.com/expressjs/express
        repoMappingConfidence:
          type: number
          format: float
          minimum: 0
          maximum: 1
          nullable: true
          description: Confidence score of the package_repos mapping used to resolve repoUrl.
          example: 0.9
        contributors:
          type: array
          description: >
            Affiliated contributors from git activity and GitHub, sorted by
            organization name, then githubLogin (nulls last), then first email.
            Empty when status is not_collected.
          items:
            $ref: "#/components/schemas/MemberContributorEntry"
        maintainers:
          type: object
          required: [registry, governanceFiles]
          properties:
            registry:
              type: array
              description: >
                Affiliated maintainers listed by the package registry. Returned
                even when status is not_collected.
              items:
                $ref: "#/components/schemas/MemberMaintainer"
            governanceFiles:
              type: array
              description: >
                Affiliated maintainers declared in the repository's governance
                files. Empty when status is not_collected.
              items:
                $ref: "#/components/schemas/MemberMaintainer"

    MemberContributors:
      description: >
        Akrites-member-affiliated contributors and maintainers of a package,
        served from stored data only (no on-demand collection). Only people
        affiliated with an Akrites member organization are returned, and each
        person appears at most once per section. When status is not_collected,
        contributors and maintainers.governanceFiles are empty while
        maintainers.registry is still returned as stored.
      allOf:
        - $ref: "#/components/schemas/MemberContributorsBody"
        - type: object
          required: [status]
          properties:
            status:
              type: string
              enum: [collected, not_collected]
              description: >
                collected when the repository has at least one stored contributor
                row, else not_collected.

    MemberContributorsJobRequest:
      type: object
      required: [purl]
      properties:
        purl:
          type: string
          example: pkg:npm/request-oauth

    MemberContributorsJobPending:
      type: object
      required: [jobId, status]
      properties:
        jobId:
          type: string
          format: uuid
        status:
          type: string
          enum: [pending]

    MemberContributorsJobFailed:
      type: object
      required: [jobId, status, reason]
      properties:
        jobId:
          type: string
          format: uuid
        status:
          type: string
          enum: [failed]
        reason:
          type: string
          description: >
            Why the job failed. Inferred-repo jobs whose result has left
            Temporal retention answer "Job result expired, resubmit the job";
            a new submission for the same purl is then accepted.
          example: Repository not found on GitHub

    MemberContributorsJobUnresolvable:
      type: object
      required: [jobId, status, reason, repoUrl]
      properties:
        jobId:
          type: string
          format: uuid
        status:
          type: string
          enum: [unresolvable]
        reason:
          type: string
          example: LLM confidence 0.4 below threshold 0.7
        repoUrl:
          type: string
          nullable: true
          description: Repository the job attempted before giving up, when there was one.

    MemberContributorsJobDone:
      allOf:
        - $ref: "#/components/schemas/MemberContributorsBody"
        - type: object
          required: [jobId, status]
          properties:
            jobId:
              type: string
              format: uuid
            status:
              type: string
              enum: [done]
              description: Job status; the collected/not_collected status of the sync endpoint is not included in this body.
            repoUrlSource:
              type: string
              enum: [llm_inferred]
              description: >
                Present only for jobs on ecosystems CDP does not track: the
                repository was inferred by a language model and verified to
                exist on GitHub. repoMappingConfidence is null on such jobs,
                maintainers.registry is empty, and the body is available for a
                limited time after completion; afterwards the poll answers
                failed with a resubmit reason.

    MemberContributorsJob:
      oneOf:
        - $ref: "#/components/schemas/MemberContributorsJobPending"
        - $ref: "#/components/schemas/MemberContributorsJobFailed"
        - $ref: "#/components/schemas/MemberContributorsJobUnresolvable"
        - $ref: "#/components/schemas/MemberContributorsJobDone"
      discriminator:
        propertyName: status
        mapping:
          pending: "#/components/schemas/MemberContributorsJobPending"
          failed: "#/components/schemas/MemberContributorsJobFailed"
          unresolvable: "#/components/schemas/MemberContributorsJobUnresolvable"
          done: "#/components/schemas/MemberContributorsJobDone"

    MemberContributorEntry:
      type: object
      description: One person, merged across all identities CDP holds for them in this section.
      required:
        - githubLogin
        - displayName
        - emails
        - registryUsernames
        - sources
        - organization
      properties:
        githubLogin:
          type: string
          nullable: true
          example: lpizzinidev
        displayName:
          type: string
          nullable: true
          example: Luca Pizzini
        emails:
          type: array
          items:
            type: string
          example: [lpizzini7@gmail.com]
        registryUsernames:
          type: array
          items:
            type: string
          example: []
        sources:
          type: array
          items:
            type: string
            enum: [git_activity, github, governance_file, registry]
          example: [git_activity, github]
        organization:
          $ref: "#/components/schemas/MemberOrganization"

    MemberMaintainer:
      allOf:
        - $ref: "#/components/schemas/MemberContributorEntry"
        - type: object
          required: [roles]
          properties:
            roles:
              type: array
              items:
                $ref: "#/components/schemas/MemberRole"

    MemberRole:
      type: object
      required: [role, roleKind, current]
      properties:
        role:
          type: string
          example: tc-member
        roleKind:
          type: string
          example: maintainer
        current:
          type: boolean
          description: Always true for registry roles. False for a governance role that has ended or whose roleKind is emeritus.

    MemberOrganization:
      type: object
      description: >
        The Akrites member organization the person is affiliated with, picked
        by highest confidenceScore, then most recently seen identity, then
        method order cdp, email_domain, github_company. The id is the member's
        canonical CDP organization id, the same for every person of that member.
      required: [id, name, confidence, confidenceScore]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          example: Google
        confidence:
          type: string
          enum: [cdp, email_domain, github_company]
        confidenceScore:
          type: number
          format: float
          minimum: 0
          maximum: 1
          example: 1

    ContactDetailBulkEntry:
      type: object
      required: [requestedPurl, found, contact]
      properties:
        requestedPurl:
          type: string
        found:
          type: boolean
        contact:
          type: object
          nullable: true
          allOf:
            - $ref: "#/components/schemas/ContactDetail"

paths:
  /akrites-external/packages/detail:
    get:
      operationId: getPackageDetail
      summary: Get package detail by PURL
      tags: [Packages]
      security:
        - M2MBearer:
            - read:akrites-packages
        - M2MBearer:
            - read:packages
        - M2MBearer:
            - read:stewardships
      parameters:
        - name: purl
          in: query
          required: true
          schema:
            type: string
            example: pkg:npm/%40angular/core
      responses:
        "200":
          description: Package detail.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PackageDetail"
        "400":
          description: Malformed purl.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Missing or invalid bearer token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Token missing read:akrites-packages, read:packages, or read:stewardships scope.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Package not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /akrites-external/packages/detail:batch:
    post:
      operationId: getPackageDetailBatch
      summary: Bulk package detail lookup
      tags: [Packages]
      security:
        - M2MBearer:
            - read:akrites-packages
        - M2MBearer:
            - read:packages
        - M2MBearer:
            - read:stewardships
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [purls]
              properties:
                purls:
                  type: array
                  minItems: 1
                  maxItems: 100
                  items:
                    type: string
                page:
                  type: integer
                  minimum: 1
                  default: 1
                pageSize:
                  type: integer
                  minimum: 1
                  maximum: 100
                  default: 20
      responses:
        "200":
          description: One page of results, in request order.
          content:
            application/json:
              schema:
                type: object
                required: [page, pageSize, total, results]
                properties:
                  page:
                    type: integer
                  pageSize:
                    type: integer
                  total:
                    type: integer
                    description: Total number of requested purls, across all pages.
                  results:
                    type: array
                    items:
                      $ref: "#/components/schemas/PackageDetailBulkEntry"
        "400":
          description: Validation error (empty array, >100 items, malformed purl).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Missing or invalid bearer token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Token missing read:akrites-packages, read:packages, or read:stewardships scope.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /akrites-external/packages/member-contributors:
    get:
      operationId: getMemberContributors
      summary: Get Akrites-member contributors and maintainers by PURL
      description: >
        Returns the contributors and maintainers of a package's linked
        repository who are affiliated with an Akrites member organization,
        from stored data only (no on-demand collection). Each person appears
        once per section. Registry maintainers are returned even when status
        is not_collected. Requires read:akrites-maintainers, or
        read:maintainer-roles from the old Self Serve client as a fallback.
        Never reachable with the packages scope.
      tags: [Contacts]
      security:
        - M2MBearer:
            - read:akrites-maintainers
        - M2MBearer:
            - read:maintainer-roles
      parameters:
        - name: purl
          in: query
          required: true
          schema:
            type: string
            example: pkg:npm/express
      responses:
        "200":
          description: Affiliated contributors and maintainers (empty lists when none are affiliated).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemberContributors"
        "400":
          description: Malformed purl.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Missing or invalid bearer token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Token missing read:akrites-maintainers, or read:maintainer-roles, scope.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Package not found, or package has no linked repository.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /akrites-external/packages/member-contributors/jobs:
    post:
      operationId: submitMemberContributorsJob
      summary: Submit an on-demand member-contributors collection job
      description: >
        Collects the linked repository's contributors from GitHub for a package
        whose member-contributors status is not_collected, resolves their
        Akrites affiliations, and stores the result so the sync endpoint serves
        it afterwards. A second submission for the same purl while a job is
        still pending or running returns the existing jobId. A deduplicated
        submission also makes sure the job's workflow is running. Packages that already have
        collected data are refused with 409, unless the purl's most recent job
        failed, in which case a new job is accepted and re-collects the
        repository. Purls from ecosystems CDP does not collect are accepted and
        routed to a workflow that infers the repository with a language model;
        those jobs end done with repoUrlSource llm_inferred or unresolvable,
        store no contributor data, and a resubmission while the previous result
        is still readable is refused with 409 whose error.context.jobId names
        the job to poll. Rate-limited independently of the read endpoints.
        Requires read:akrites-maintainers, or read:maintainer-roles from the old
        Self Serve client as a fallback. A done job whose repository reports no
        human contributors on GitHub leaves the package not_collected;
        resubmitting it fetches again and returns the same empty result.
      tags: [Contacts]
      security:
        - M2MBearer:
            - read:akrites-maintainers
        - M2MBearer:
            - read:maintainer-roles
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MemberContributorsJobRequest"
      responses:
        "202":
          description: Job accepted, or an already-pending job for the same purl.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemberContributorsJobPending"
        "400":
          description: Malformed purl.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Missing or invalid bearer token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Token missing read:akrites-maintainers, or read:maintainer-roles, scope.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Package not found, or package has no linked repository.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Member contributors already collected for this purl (stored data on tracked ecosystems, or a still-readable result on inferred-repo jobs; error.context.jobId names it); use the sync endpoint or poll that job.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConflictError"
        "429":
          description: Too many requests — rate-limited independently of the other endpoints.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /akrites-external/packages/member-contributors/jobs/{jobId}:
    get:
      operationId: getMemberContributorsJob
      summary: Poll an on-demand member-contributors collection job
      description: >
        Returns pending until the job finishes, failed with a reason,
        unresolvable with a reason when no repository could be inferred, or
        done with the same body the sync endpoint returns for the purl plus
        jobId and status.
      tags: [Contacts]
      security:
        - M2MBearer:
            - read:akrites-maintainers
        - M2MBearer:
            - read:maintainer-roles
      parameters:
        - name: jobId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Job state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemberContributorsJob"
        "400":
          description: Malformed jobId (not a UUID).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Missing or invalid bearer token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Token missing read:akrites-maintainers, or read:maintainer-roles, scope.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: No job with this jobId.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /akrites-external/project-profiling:
    get:
      operationId: getProjectProfiling
      summary: Get the assembled vulnerability-reporting protocol by PURL
      description: >
        Assembled methods can include inferred security_contacts fallbacks whose
        endpoint is a maintainer/committer email (contact PII), so this endpoint
        requires read:akrites-maintainers, or read:maintainer-roles from the old
        Self Serve client as a fallback. Never reachable with the packages scopes.
      tags: [Project Profiling]
      security:
        - M2MBearer:
            - read:akrites-maintainers
        - M2MBearer:
            - read:maintainer-roles
      parameters:
        - name: purl
          in: query
          required: true
          schema:
            type: string
            example: pkg:npm/%40angular/core
      responses:
        "200":
          description: The assembled reporting protocol for the package's best-matched repo.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectProfiling"
        "400":
          description: Malformed purl.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Missing or invalid bearer token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Token missing read:akrites-maintainers or read:maintainer-roles scope.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Package not found, or its best-matched repo has no assembled protocol.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /akrites-external/project-profiling:batch:

<!DOCTYPE html>
<html lang="en">
  <head>
    <title>LFX Community Data Platform | App</title>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1"
    />
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="/icons/apple-touch-icon.png"
    />
    <link
      rel="icon"
      type="image/ico"
      href="/favicon.ico"
    />
    <link
      rel="preconnect"
      href="https://fonts.googleapis.com"
    />
    <link
      rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin
    />
    <!-- We use the full link to the CSS file in the rest of the tags -->

    <script src="https://kit.fontawesome.com/b5289aebdf.js" crossorigin="anonymous"></script>
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@300;400;500;600;700&family=Roboto+Slab:wght@400;600&display=swap"
    />

    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@300;400;500;600;700&family=Roboto+Slab:wght@400;600&display=swap"
      media="print"
      onload="this.media='all'"
    />

    <noscript>
      <link
        href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@300;400;500;600;700&family=Roboto+Slab:wght@400;600&display=swap"
        rel="stylesheet"
      />
    </noscript>
    <script src="https://cdn.platform.linuxfoundation.org/lfx-header-v2.js"></script>
  </head>

  <body>
    <noscript>
      <strong
        >LFX Community Data Platform needs JavaScript enabled.</strong
      >
    </noscript>
    <div id="app"></div>
    <!-- built files will be auto injected -->
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>

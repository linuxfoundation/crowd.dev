packages:
  - 'services/libs/*'
  - 'services/archetypes/*'
  - 'services/apps/*'
  - '!services/cronjobs'
  - 'services'
  - 'backend'
  - '.github/actions/node'

catalog:
  '@temporalio/activity': ~1.17.2
  '@temporalio/client': ~1.17.2
  '@temporalio/common': ~1.17.2
  '@temporalio/proto': ~1.17.2
  '@temporalio/worker': ~1.17.2
  '@temporalio/workflow': ~1.17.2
  '@types/node': ^24.13.3
  axios: ^1.19.0
  config: ^3.3.12
  eslint: ^8.39.0
  pg-promise: ^11.4.3
  prettier: ^3.3.3
  tsx: ^4.20.3
  typescript: ^5.6.3

allowBuilds:
  '@datadog/native-appsec': false
  '@datadog/native-iast-taint-tracking': false
  '@datadog/native-metrics': false
  '@datadog/pprof': false
  '@swc/core': true
  bcrypt: true
  bufferutil: true
  dd-trace: true
  dtrace-provider: false
  es5-ext: false
  esbuild: true
  nodemon: false
  protobufjs: false
  utf-8-validate: true

version: '3.1'

x-env-args: &env-args
  DOCKER_BUILDKIT: 1
  NODE_ENV: docker
  SERVICE: docs-readiness-worker
  CROWD_TEMPORAL_TASKQUEUE: docs-readiness
  SHELL: /bin/sh

services:
  docs-readiness-worker:
    build:
      context: ../../
      dockerfile: ./scripts/services/docker/Dockerfile.docs_readiness_worker
    command: 'pnpm run start'
    working_dir: /usr/crowd/app/services/apps/docs_readiness_worker
    env_file:
      - ../../backend/.env.dist.local
      - ../../backend/.env.dist.composed
      - ../../backend/.env.override.local
      - ../../backend/.env.override.composed
    environment:
      <<: *env-args
    restart: always
    networks:
      - crowd-bridge

  docs-readiness-worker-dev:
    build:
      context: ../../
      dockerfile: ./scripts/services/docker/Dockerfile.docs_readiness_worker
    command: 'pnpm run dev'
    working_dir: /usr/crowd/app/services/apps/docs_readiness_worker
    # user: '${USER_ID}:${GROUP_ID}'
    env_file:
      - ../../backend/.env.dist.local
      - ../../backend/.env.dist.composed
      - ../../backend/.env.override.local
      - ../../backend/.env.override.composed
    environment:
      <<: *env-args
    hostname: docs-readiness-worker
    networks:
      - crowd-bridge
    volumes:
      - ../../services/libs/common_services/src:/usr/crowd/app/services/libs/common_services/src
      - ../../services/libs/data-access-layer/src:/usr/crowd/app/services/libs/data-access-layer/src
      - ../../services/libs/types/src:/usr/crowd/app/services/libs/types/src
      - ../../services/apps/docs_readiness_worker/src:/usr/crowd/app/services/apps/docs_readiness_worker/src

networks:
  crowd-bridge:
    external: true
